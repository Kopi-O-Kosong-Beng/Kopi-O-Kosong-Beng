name: brew

on:
  schedule:
    # 20:30 UTC is 04:30 in Singapore. Deliberately off the hour, because
    # GitHub sheds scheduled runs that pile up on the hour.
    - cron: "30 20 * * *"
  workflow_dispatch:

# Scheduled workflows are switched off after 60 days without repository
# activity. The daily commit below is made with GITHUB_TOKEN, which does not
# reliably count, so if the card ever silently stops refreshing, re-enable this
# workflow from the Actions tab.

permissions:
  contents: write

jobs:
  brew:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Read the public contribution calendar
        env:
          KOPI_LOGIN: ${{ github.repository_owner }}
        run: python scripts/fetch_kopi_stats.py

      - name: Redraw the chit
        run: python scripts/generate_kopi_chit.py

      # Nothing is pushed until the guards agree with it. A failed fetch leaves
      # the previous stats file in place, so the card goes stale rather than
      # wrong.
      - name: Check the guards before anything ships
        run: python -m unittest discover -s tests -v

      - name: Commit if anything moved
        run: |
          if [ -z "$(git status --porcelain data assets)" ]; then
            echo "Nothing brewed today."
            exit 0
          fi
          git config user.name "kopi stall"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data assets
          git commit -m "chore: refill the tab"
          git push
