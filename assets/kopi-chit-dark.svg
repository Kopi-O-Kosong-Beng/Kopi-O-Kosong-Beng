<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 372" role="img" aria-labelledby="title desc">
  <title id="title">The numbers at Kopi O Kosong Beng, the GitHub account of Chia Zhi Feng</title>
  <desc id="desc">A printed stats chit. 842 contributions over the past year, with 23 days longest streak (07 to 29 jul), 11 days current streak (since 31 jul), 75 busiest day (07 jul), 29/30 active, last 30 days (days pushed). An area chart traces the last 30 days, and a line at the foot says the account last pushed today.</desc>
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <style>
    text { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .ink { fill: #F2E5D1; }
    .soft { fill: #A78D70; }
    .accent { fill: #E09551; }
    .sheet { fill: #100D0A; }
    .chit { fill: #1B1611; stroke: #3B2F23; stroke-width: 1.25; }
    .dot { fill: none; stroke: #3B2F23; stroke-width: 1; stroke-dasharray: 1 3; }
    .meta { font-size: 9px; letter-spacing: 1.8px; }
    .eyebrow { font-size: 8px; letter-spacing: 2.4px; }
    .hero { font-size: 76px; font-weight: 700; letter-spacing: -2.5px; fill: #E09551; }
    .sub { font-size: 8.5px; letter-spacing: 1.6px; }
    .figure { font-size: 27px; font-weight: 700; letter-spacing: -0.4px; }
    .spark-fill { fill: #E09551; opacity: 0.16; }
    .spark-line { fill: none; stroke: #E09551; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .spark-base { fill: none; stroke: #3B2F23; stroke-width: 1; }
    .spark-dot { fill: #E09551; }
    /* Only today's dot on the chart moves, and it rests at full opacity, so a
       renderer parked at t=0 shows the finished card. An earlier version
       animated the artwork itself and rendered wrong wherever the animation
       was not running. */
    .blink { animation: settle 2.6s ease-in-out infinite; }
    @keyframes settle {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    @media (prefers-reduced-motion: reduce) {
      .still { animation: none !important; }
    }
  </style>

