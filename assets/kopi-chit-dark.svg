<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 356" role="img" aria-labelledby="title desc">
  <title id="title">The order chit of Chia Zhi Feng, printed at the Kopi O Kosong Beng stall</title>
  <desc id="desc">A printed order chit. Its headline, shown inside a dial, is 28/30: of the last 30 days had work pushed. Alongside it: 739 commits, past year, 23 days longest streak, to 29 jul. An area chart traces the last 30 days.</desc>
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <style>
    text { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .ink { fill: #F2E5D1; }
    .soft { fill: #A78D70; }
    .sheet { fill: #100D0A; }
    .chit { fill: #1B1611; stroke: #3B2F23; stroke-width: 1.25; }
    .dot { fill: none; stroke: #3B2F23; stroke-width: 1; stroke-dasharray: 1 3; }
    .pill { fill: none; stroke: #3B2F23; stroke-width: 1; }
    .meta { font-size: 9px; letter-spacing: 1.8px; }
    .eyebrow { font-size: 8px; letter-spacing: 2.4px; }
    .caption { font-size: 12px; letter-spacing: 0.3px; }
    .hero { font-size: 40px; font-weight: 700; letter-spacing: -1px; fill: #E09551; }
    .figure { font-size: 26px; font-weight: 700; letter-spacing: -0.4px; }
    .ring-track { fill: none; stroke: #2A2119; stroke-width: 13; }
    .ring { fill: none; stroke: #E09551; stroke-width: 13; stroke-linecap: round; }
    .spark-fill { fill: #E09551; opacity: 0.16; }
    .spark-line { fill: none; stroke: #E09551; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .spark-base { fill: none; stroke: #3B2F23; stroke-width: 1; }
    .spark-dot { fill: #E09551; }
    /* Only today's dot on the chart moves, and it rests at full opacity, so a
       renderer parked at t=0 shows the finished card. An earlier version
       animated the artwork itself and rendered wrong wherever the animation
       was not running. */
    .blink { animation: settle 3.4s ease-in-out infinite; }
    @keyframes settle {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.45; }
    }
    @media (prefers-reduced-motion: reduce) {
      .still { animation: none !important; }
    }
  </style>

  <rect class="sheet" width="900" height="356" rx="26"/>
