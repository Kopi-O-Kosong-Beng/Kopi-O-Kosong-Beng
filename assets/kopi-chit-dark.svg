  <text x="380" y="246" text-anchor="start" class="ink figure">739</text>
  <text x="380" y="264" text-anchor="start" class="soft eyebrow">COMMITS, PAST YEAR</text>
  <text x="838" y="246" text-anchor="end" class="ink figure">23 days</text>
  <text x="838" y="264" text-anchor="end" class="soft eyebrow">LONGEST STREAK, TO 29 JUL</text>


  <rect width="900" height="356" rx="26" filter="url(#grain)" opacity="0.05"/>
