  <text x="62" y="54" class="soft mono meta">KOPI O KOSONG BENG &#183; ORDER #0739 &#183; 04 AUG 2026</text>
  <path class="dot" d="M 62 68 H 838"/>

  <rect class="pill" x="62" y="80" width="168" height="22" rx="11"/>
  <text x="146" y="94.5" text-anchor="middle" class="soft mono eyebrow">ACTIVE DAYS</text>

