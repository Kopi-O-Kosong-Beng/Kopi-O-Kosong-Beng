<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc">
  <title id="title">The counter at Kopi O Kosong Beng: what Chia Zhi Feng is building</title>
  <desc id="desc">A printed chit listing what is on the counter. pitchMe, an AI speaking coach. you talk, it tells you the truth. built with typescript, gcp; a robot arm, taught to pick things up without dropping them. built with python, ros; a two player math game, no CPU in it. just wires and states. built with fpga; quantum devices, made at hours I would rather not say. built with python. A line at the foot says the stall last served today.</desc>
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <style>
    text { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .ink { fill: #3A2214; }
    .soft { fill: #816548; }
    .sheet { fill: #F2E7D5; }
    .chit { fill: #FBF4E7; stroke: #D9C3A5; stroke-width: 1.25; }
    .dot { fill: none; stroke: #D9C3A5; stroke-width: 1; stroke-dasharray: 1 3; }
    .meta { font-size: 9px; letter-spacing: 1.8px; }
    .eyebrow { font-size: 8px; letter-spacing: 2.4px; }
    .name { font-size: 19px; font-weight: 700; letter-spacing: 0.2px; }
    .note { font-size: 8.5px; letter-spacing: 2px; fill: #C2703A; }
    .line { font-size: 11.5px; letter-spacing: 0.2px; }
    .chip { fill: #E6D8C0; }
    .chip-text { font-size: 8px; letter-spacing: 1.4px; }
    .pulse { fill: #C2703A; }
    /* Only the live dot moves, and it rests at full opacity, so a renderer
       parked at t=0 shows the finished card. An earlier version animated the
       artwork itself and rendered wrong wherever the animation was not
       running. */
    .blink { animation: settle 2.6s ease-in-out infinite; }
    @keyframes settle {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    @media (prefers-reduced-motion: reduce) {
      .still { animation: none !important; }
    }
  </style>

  <rect class="sheet" width="900" height="450" rx="26"/>
