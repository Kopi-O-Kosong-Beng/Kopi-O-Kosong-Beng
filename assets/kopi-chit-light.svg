<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 356" role="img" aria-labelledby="title desc">
  <title id="title">The numbers at Kopi O Kosong Beng, the GitHub account of Chia Zhi Feng</title>
  <desc id="desc">A printed stats chit. 739 contributions over the past year, with 23 days longest streak, 5 days current streak, 75 busiest day, 28/30 active, last 30 days. An area chart traces the last 30 days, and a line at the foot says the account last pushed today.</desc>
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <style>
    text { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .ink { fill: #3A2214; }
    .soft { fill: #816548; }
    .sheet { fill: #F2E7D5; }
    .chit { fill: #FBF4E7; stroke: #D9C3A5; stroke-width: 1.25; }
    .dot { fill: none; stroke: #D9C3A5; stroke-width: 1; stroke-dasharray: 1 3; }
    .meta { font-size: 9px; letter-spacing: 1.8px; }
    .eyebrow { font-size: 8px; letter-spacing: 2.4px; }
    .hero { font-size: 76px; font-weight: 700; letter-spacing: -2.5px; fill: #C2703A; }
    .figure { font-size: 27px; font-weight: 700; letter-spacing: -0.4px; }
    .spark-fill { fill: #C2703A; opacity: 0.16; }
    .spark-line { fill: none; stroke: #C2703A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .spark-base { fill: none; stroke: #D9C3A5; stroke-width: 1; }
    .spark-dot { fill: #C2703A; }
    /* Only today's dot on the chart moves, and it rests at full opacity, so a
       renderer parked at t=0 shows the finished card. An earlier version
       animated the artwork itself and rendered wrong wherever the animation
       was not running. */
    .blink { animation: settle 2.6s ease-in-out infinite; }
    @keyframes settle {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    @media (prefers-reduced-motion: reduce) {
      .still { animation: none !important; }
    }
  </style>

