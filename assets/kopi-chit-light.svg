<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 426" role="img" aria-labelledby="title desc">
  <title id="title">The order chit of Chia Zhi Feng, printed at the Kopi O Kosong Beng stall</title>
  <desc id="desc">A printed order chit. Over the past year: 726 contributions, a longest unbroken streak of 23 days, and 57% of the whole year landing in its 10 busiest days, which says the work comes in bursts rather than a steady drip. Below that, seven glasses compare how much lands on each weekday, each poured as full as that day is busy. The quietest weekday by a wide margin is FRI.</desc>
  <style>
    text { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .ink { fill: #3A2214; }
    .soft { fill: #816548; }
    .chit { fill: #FBF4E7; stroke: #D9C3A5; stroke-width: 1.5; }
    .dot { fill: none; stroke: #D9C3A5; stroke-width: 1; stroke-dasharray: 1 3; }
    .rule { fill: none; stroke: #D9C3A5; stroke-width: 1; }
    .head { font-size: 17px; font-weight: 700; letter-spacing: 2.8px; }
    .meta { font-size: 9px; letter-spacing: 1.6px; }
    .item { font-size: 11.5px; letter-spacing: 0.4px; }
    .label { font-size: 9px; letter-spacing: 3px; }
    .day { font-size: 9px; letter-spacing: 2px; }
    .tag { font-size: 8px; letter-spacing: 1.6px; fill: #C2703A; }
    .track { fill: #E6D8C0; }
    .gauge { fill: #C2703A; }
    .tumbler { fill: #FBF4E7; stroke: #71878E; stroke-width: 2; stroke-linejoin: round; }
    .pour { fill: #C2703A; }
    .pour-quiet { fill: #E6D8C0; }
    /* Only the rest day tag moves, and it rests at full opacity, so a renderer
       parked at t=0 shows the finished card. An earlier version animated the
       artwork itself and rendered wrong wherever the animation was not
       running. */
    .blink { animation: settle 3.4s ease-in-out infinite; }
    @keyframes settle {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.45; }
    }
    @media (prefers-reduced-motion: reduce) {
      .still { animation: none !important; }
    }
  </style>

  <rect width="900" height="426" rx="14" fill="#F2E7D5"/>
