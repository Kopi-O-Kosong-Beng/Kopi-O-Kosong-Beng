  <text x="70" y="64" class="ink head">KOPI O KOSONG BENG</text>
  <text x="70" y="84" class="soft mono meta">ORDER #0726 &#183; 03 AUG 2026</text>
  <path class="dot" d="M 70 100 H 830"/>

  <text x="70" y="128" class="ink mono item">commits, past year</text>
  <text x="830" y="128" text-anchor="end" class="ink mono item">726</text>
  <text x="70" y="152" class="ink mono item">longest streak</text>
  <text x="830" y="152" text-anchor="end" class="ink mono item">23 days to 29 JUL</text>
