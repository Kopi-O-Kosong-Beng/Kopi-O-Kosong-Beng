<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title desc">
  <title id="title">The order chit of Chia Zhi Feng, printed at the Kopi O Kosong Beng stall</title>
  <desc id="desc">A printed order chit. Its headline, shown inside a dial, is 57% of the whole year landed in 10 days. Alongside it: 726 commits, past year, 23 days longest streak, to 29 jul. An area chart traces the last 30 days, and a strip along the bottom splits the week into seven parts, each as wide as that weekday's share. FRI is so far below the rest that it is marked closed.</desc>
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <style>
    text { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .ink { fill: #3A2214; }
    .soft { fill: #816548; }
    .sheet { fill: #F2E7D5; }
    .chit { fill: #FBF4E7; stroke: #D9C3A5; stroke-width: 1.25; }
    .dot { fill: none; stroke: #D9C3A5; stroke-width: 1; stroke-dasharray: 1 3; }
    .pill { fill: none; stroke: #D9C3A5; stroke-width: 1; }
    .meta { font-size: 9px; letter-spacing: 1.8px; }
    .eyebrow { font-size: 8px; letter-spacing: 2.4px; }
    .hero { font-size: 40px; font-weight: 700; letter-spacing: -1px; fill: #C2703A; }
    .figure { font-size: 26px; font-weight: 700; letter-spacing: -0.4px; }
    .ring-track { fill: none; stroke: #E6D8C0; stroke-width: 13; }
    .ring { fill: none; stroke: #C2703A; stroke-width: 13; stroke-linecap: round; }
    .spark-fill { fill: #C2703A; opacity: 0.16; }
    .spark-line { fill: none; stroke: #C2703A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .spark-base { fill: none; stroke: #D9C3A5; stroke-width: 1; }
    .spark-dot { fill: #C2703A; }
    .caption { font-size: 12px; letter-spacing: 0.3px; }
    .day { font-size: 9px; letter-spacing: 2px; }
    .tag { font-size: 8px; letter-spacing: 1.6px; fill: #C2703A; }
    .seg { fill: #C2703A; }
    .seg-quiet { fill: #E6D8C0; }
    /* Only the rest day tag moves, and it rests at full opacity, so a renderer
       parked at t=0 shows the finished card. An earlier version animated the
       artwork itself and rendered wrong wherever the animation was not
       running. */
    .blink { animation: settle 3.4s ease-in-out infinite; }
    @keyframes settle {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.45; }
    }
    @media (prefers-reduced-motion: reduce) {
      .still { animation: none !important; }
    }
  </style>

  <rect class="sheet" width="900" height="440" rx="26"/>
  <path class="chit" d="M 24 22 H 876 V 400 L 869.74 414 L 863.47 400 L 857.21 414 L 850.94 400 L 844.68 414 L 838.41 400 L 832.15 414 L 825.88 400 L 819.62 414 L 813.35 400 L 807.09 414 L 800.82 400 L 794.56 414 L 788.29 400 L 782.03 414 L 775.76 400 L 769.5 414 L 763.24 400 L 756.97 414 L 750.71 400 L 744.44 414 L 738.18 400 L 731.91 414 L 725.65 400 L 719.38 414 L 713.12 400 L 706.85 414 L 700.59 400 L 694.32 414 L 688.06 400 L 681.79 414 L 675.53 400 L 669.26 414 L 663 400 L 656.74 414 L 650.47 400 L 644.21 414 L 637.94 400 L 631.68 414 L 625.41 400 L 619.15 414 L 612.88 400 L 606.62 414 L 600.35 400 L 594.09 414 L 587.82 400 L 581.56 414 L 575.29 400 L 569.03 414 L 562.76 400 L 556.5 414 L 550.24 400 L 543.97 414 L 537.71 400 L 531.44 414 L 525.18 400 L 518.91 414 L 512.65 400 L 506.38 414 L 500.12 400 L 493.85 414 L 487.59 400 L 481.32 414 L 475.06 400 L 468.79 414 L 462.53 400 L 456.26 414 L 450 400 L 443.74 414 L 437.47 400 L 431.21 414 L 424.94 400 L 418.68 414 L 412.41 400 L 406.15 414 L 399.88 400 L 393.62 414 L 387.35 400 L 381.09 414 L 374.82 400 L 368.56 414 L 362.29 400 L 356.03 414 L 349.76 400 L 343.5 414 L 337.24 400 L 330.97 414 L 324.71 400 L 318.44 414 L 312.18 400 L 305.91 414 L 299.65 400 L 293.38 414 L 287.12 400 L 280.85 414 L 274.59 400 L 268.32 414 L 262.06 400 L 255.79 414 L 249.53 400 L 243.26 414 L 237 400 L 230.74 414 L 224.47 400 L 218.21 414 L 211.94 400 L 205.68 414 L 199.41 400 L 193.15 414 L 186.88 400 L 180.62 414 L 174.35 400 L 168.09 414 L 161.82 400 L 155.56 414 L 149.29 400 L 143.03 414 L 136.76 400 L 130.5 414 L 124.24 400 L 117.97 414 L 111.71 400 L 105.44 414 L 99.18 400 L 92.91 414 L 86.65 400 L 80.38 414 L 74.12 400 L 67.85 414 L 61.59 400 L 55.32 414 L 49.06 400 L 42.79 414 L 36.53 400 L 30.26 414 L 24 400 Z"/>

  <text x="62" y="54" class="soft mono meta">KOPI O KOSONG BENG &#183; ORDER #0726 &#183; 03 AUG 2026</text>
  <path class="dot" d="M 62 68 H 838"/>

  <rect class="pill" x="62" y="80" width="168" height="22" rx="11"/>
  <text x="146" y="94.5" text-anchor="middle" class="soft mono eyebrow">BUSIEST 10 DAYS</text>

  <circle class="ring-track" cx="196" cy="186" r="68"/>
  <path class="ring" d="M 196 118 A 68 68 0 1 1 165.89 246.97"/>
  <text x="196" y="200" text-anchor="middle" class="hero">57%</text>
  <text x="62" y="288" class="soft mono caption">of the whole year landed in 10 days</text>

  <text x="380" y="102" class="soft mono eyebrow">THE LAST 30 DAYS</text>
  <polygon class="spark-fill" points="380,200 380,200 395.79,200 411.59,122 427.38,176.08 443.17,164.64 458.97,198.96 474.76,168.8 490.55,165.68 506.34,180.24 522.14,168.8 537.93,187.52 553.72,186.48 569.52,197.92 585.31,177.12 601.1,160.48 616.9,154.24 632.69,167.76 648.48,181.28 664.28,165.68 680.07,196.88 695.86,174 711.66,155.28 727.45,190.64 743.24,168.8 759.03,190.64 774.83,200 790.62,192.72 806.41,184.4 822.21,142.8 838,187.52 838,200"/>
  <polyline class="spark-line" points="380,200 395.79,200 411.59,122 427.38,176.08 443.17,164.64 458.97,198.96 474.76,168.8 490.55,165.68 506.34,180.24 522.14,168.8 537.93,187.52 553.72,186.48 569.52,197.92 585.31,177.12 601.1,160.48 616.9,154.24 632.69,167.76 648.48,181.28 664.28,165.68 680.07,196.88 695.86,174 711.66,155.28 727.45,190.64 743.24,168.8 759.03,190.64 774.83,200 790.62,192.72 806.41,184.4 822.21,142.8 838,187.52"/>
  <path class="spark-base" d="M 380 200 H 838"/>
  <circle class="spark-dot blink still" cx="838" cy="187.52" r="3.5"/>
  <path class="dot" d="M 380 218 H 838"/>

  <text x="380" y="246" text-anchor="start" class="ink figure">726</text>
  <text x="380" y="264" text-anchor="start" class="soft eyebrow">COMMITS, PAST YEAR</text>
  <text x="838" y="246" text-anchor="end" class="ink figure">23 days</text>
  <text x="838" y="264" text-anchor="end" class="soft eyebrow">LONGEST STREAK, TO 29 JUL</text>

  <path class="dot" d="M 62 300 H 838"/>
  <text x="62" y="320" class="soft mono eyebrow">HOW THE WEEK SPLITS</text>
  <rect class="seg" x="62" y="330" width="95.29" height="22" rx="3"/>
  <text x="109.65" y="368" text-anchor="middle" class="soft mono day">M</text>
  <rect class="seg" x="161.29" y="330" width="184.37" height="22" rx="3"/>
  <text x="253.48" y="368" text-anchor="middle" class="soft mono day">T</text>
  <rect class="seg" x="349.67" y="330" width="78.72" height="22" rx="3"/>
  <text x="389.03" y="368" text-anchor="middle" class="soft mono day">W</text>
  <rect class="seg" x="432.39" y="330" width="93.22" height="22" rx="3"/>
  <text x="479" y="368" text-anchor="middle" class="soft mono day">T</text>
  <rect class="seg-quiet" x="529.61" y="330" width="16.57" height="22" rx="3"/>
  <text x="537.9" y="368" text-anchor="middle" class="soft mono day">F</text>
  <text x="537.9" y="384" text-anchor="middle" class="tag mono blink still">closed</text>
  <rect class="seg" x="550.19" y="330" width="97.37" height="22" rx="3"/>
  <text x="598.87" y="368" text-anchor="middle" class="soft mono day">S</text>
  <rect class="seg" x="651.55" y="330" width="186.45" height="22" rx="3"/>
  <text x="744.78" y="368" text-anchor="middle" class="soft mono day">S</text>

  <rect width="900" height="440" rx="26" filter="url(#grain)" opacity="0.05"/>
</svg>
