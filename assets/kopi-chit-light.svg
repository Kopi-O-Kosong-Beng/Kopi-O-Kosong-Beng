<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 406" role="img" aria-labelledby="title desc">
  <title id="title">The order chit of Chia Zhi Feng, printed at the Kopi O Kosong Beng stall</title>
  <desc id="desc">A printed order chit listing 726 contributions in the past year, a longest unbroken streak of 23 days, and 45 active days out of 366. Below the totals a bar chart shows the last thirty days, one bar per day, taller on the busier days.</desc>
  <style>
    text { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .ink { fill: #3A2214; }
    .soft { fill: #816548; }
    .chit { fill: #FBF4E7; stroke: #D9C3A5; stroke-width: 1.5; }
    .dot { fill: none; stroke: #D9C3A5; stroke-width: 1; stroke-dasharray: 1 3; }
    .rule { fill: none; stroke: #D9C3A5; stroke-width: 1; }
    .head { font-size: 17px; font-weight: 700; letter-spacing: 2.8px; }
    .meta { font-size: 9px; letter-spacing: 1.6px; }
    .item { font-size: 11.5px; letter-spacing: 0.4px; }
    .label { font-size: 9px; letter-spacing: 3px; }
    .tick { font-size: 7.5px; letter-spacing: 1.4px; }
    .track { fill: #E6D8C0; }
    .gauge { fill: #C2703A; }
    .bar { fill: #C2703A; }
    .bar-idle { fill: #E6D8C0; }
    /* Only today's bar moves, and it rests at full opacity, so a
       renderer parked at t=0 shows the finished card. An earlier version
       animated the artwork itself and rendered wrong wherever the animation
       was not running. */
    .today { animation: settle 3.4s ease-in-out infinite; }
    @keyframes settle {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    @media (prefers-reduced-motion: reduce) {
      .still { animation: none !important; }
    }
  </style>

