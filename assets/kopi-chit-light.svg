<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">The order chit of Chia Zhi Feng, printed at the Kopi O Kosong Beng stall</title>
  <desc id="desc">A printed order chit listing 726 contributions in the past year, a longest run of 23 days, and 45 of 366 days brewed, above a bar chart of the last thirty days. Beside it stands a tall glass of iced kopi filled to the share of days brewed, its ice cubes stamped py, c++, ts, ros, fpga, gcp.</desc>
  <style>
    text { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .ink { fill: #3A2214; }
    .soft { fill: #816548; }
    .chit { fill: #FBF4E7; stroke: #D9C3A5; stroke-width: 1.5; }
    .dot { fill: none; stroke: #D9C3A5; stroke-width: 1; stroke-dasharray: 1 3; }
    .rule { fill: none; stroke: #D9C3A5; stroke-width: 1; }
    .head { font-size: 15px; font-weight: 700; letter-spacing: 2.6px; }
    .meta { font-size: 9px; letter-spacing: 1.6px; }
    .item { font-size: 11.5px; letter-spacing: 0.4px; }
    .label { font-size: 9px; letter-spacing: 3px; }
    .spark { fill: #C2703A; }
    .spark-idle { fill: #D9C3A5; }
    .brew { fill: #472A15; }
    .brew-top { fill: #7A4A22; }
    .ice { fill: #E8F1F3; fill-opacity: 0.92; stroke: #AFC6CC; stroke-width: 1; }
    .cube { fill: #4A2C17; text-anchor: middle; letter-spacing: 0.2px; }
    .glass { fill: none; stroke: #71878E; stroke-width: 2.4; stroke-linejoin: round; }
    .straw { fill: none; stroke: #C2703A; stroke-width: 4; stroke-linecap: round; }
    .drop { fill: #E8F1F3; opacity: 0; }
    .drop-a { animation: bead 5s ease-in 0s infinite; }
    .drop-b { animation: bead 5s ease-in 1.7s infinite; }
    .drop-c { animation: bead 5s ease-in 3.4s infinite; }
    /* No fill-mode and no delay on purpose. The resting state of the coffee
       has to be its final level, because anything that does not run the
       animation, a still thumbnail or a reduced motion viewer, must still see
       a full glass rather than an empty one. */
    .pour { animation: pour 1.8s cubic-bezier(0.2, 0.75, 0.25, 1) 1; }
    @keyframes bead {
      0% { transform: translateY(0px); opacity: 0; }
      12% { opacity: 0.85; }
      70% { opacity: 0.7; }
      100% { transform: translateY(44px); opacity: 0; }
    }
    @keyframes pour {
      from { transform: translateY(160px); }
      to { transform: translateY(0px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .motion { animation: none !important; opacity: 0.7 !important; }
      .pour { animation: none !important; }
    }
  </style>

  <rect width="900" height="360" rx="14" fill="#F2E7D5"/>
